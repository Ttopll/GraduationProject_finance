<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭财务管理后台</title>
  <link rel="stylesheet" href="/admin-mvp.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-logo">FM</div>
        <div>
          <div class="brand-title">家庭财务管理系统</div>
          <div class="brand-subtitle">Admin Console</div>
        </div>
      </div>
      <nav class="menu">
        <button class="menu-item is-active" type="button">真实数据分析</button>
        <button class="menu-item" type="button">导入管理</button>
        <button class="menu-item" type="button">规则与通知</button>
        <button class="menu-item" type="button">系统验收</button>
      </nav>
      <section class="sidebar-panel">
        <p class="panel-label">当前目标</p>
        <p class="panel-text">按若依风格承接真实数据导入、分析结果、结论输出和后续模块扩展。</p>
      </section>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <p class="eyebrow">数据治理与分析后台</p>
          <h1>真实数据分析总控台</h1>
        </div>
        <div class="session-box">
          <div id="loginStatus" class="session-status">未登录</div>
        </div>
      </header>

      <section class="workspace-grid">
        <section class="panel panel-auth">
          <div class="panel-head">
            <div>
              <p class="panel-eyebrow">Auth</p>
              <h2>后台登录</h2>
            </div>
          </div>
          <div class="form-row">
            <input id="username" class="field-input" placeholder="用户名">
            <input id="password" class="field-input" type="password" placeholder="密码">
            <button id="loginBtn" class="primary-btn" type="button">登录</button>
          </div>
        </section>

        <section class="panel panel-actions">
          <div class="panel-head">
            <div>
              <p class="panel-eyebrow">Actions</p>
              <h2>导入与验收</h2>
            </div>
          </div>
          <div class="action-row">
            <button id="importBtn" class="secondary-btn" type="button">执行导入</button>
            <button id="acceptanceBtn" class="primary-btn" type="button">一键验收</button>
            <button id="summaryBtn" class="ghost-btn" type="button">加载汇总</button>
          </div>
          <div id="importStatus" class="inline-status">等待操作</div>
        </section>

        <section class="panel panel-filter">
          <div class="panel-head">
            <div>
              <p class="panel-eyebrow">Filters</p>
              <h2>分析参数</h2>
            </div>
          </div>
          <div class="form-row">
            <label class="field-group">
              <span>国家 ISO3</span>
              <input id="countryIso3" class="field-input" value="CHN">
            </label>
            <label class="field-group">
              <span>FRED 序列</span>
              <input id="seriesId" class="field-input" value="PCE">
            </label>
          </div>
        </section>

        <section class="metrics-row">
          <article class="metric-card">
            <p class="metric-label">零售记录数</p>
            <div id="metricTotalRecords" class="metric-value">-</div>
          </article>
          <article class="metric-card">
            <p class="metric-label">零售总金额</p>
            <div id="metricTotalAmount" class="metric-value">-</div>
          </article>
          <article class="metric-card">
            <p class="metric-label">国家趋势点数</p>
            <div id="metricWorldBankPoints" class="metric-value">-</div>
          </article>
          <article class="metric-card">
            <p class="metric-label">FRED 点数</p>
            <div id="metricFredPoints" class="metric-value">-</div>
          </article>
        </section>

        <section class="panel panel-chart">
          <div class="panel-head">
            <div>
              <p class="panel-eyebrow">Retail Mix</p>
              <h2>国家交易额 Top 10</h2>
            </div>
          </div>
          <div id="countryList" class="list-board"></div>
        </section>

        <section class="panel panel-trend">
          <div class="panel-head">
            <div>
              <p class="panel-eyebrow">World Bank</p>
              <h2>国家趋势摘要</h2>
            </div>
          </div>
          <div id="worldBankSummary" class="summary-board"></div>
        </section>

        <section class="panel panel-fred">
          <div class="panel-head">
            <div>
              <p class="panel-eyebrow">FRED</p>
              <h2>宏观序列状态</h2>
            </div>
          </div>
          <div id="fredSummary" class="summary-board"></div>
        </section>

        <section class="panel panel-conclusion">
          <div class="panel-head">
            <div>
              <p class="panel-eyebrow">Conclusions</p>
              <h2>自动生成结论</h2>
            </div>
          </div>
          <div id="conclusionList" class="conclusion-board"></div>
        </section>

        <section class="panel panel-raw">
          <div class="panel-head">
            <div>
              <p class="panel-eyebrow">Payload</p>
              <h2>原始回执</h2>
            </div>
          </div>
          <pre id="rawPayload" class="raw-box">(waiting)</pre>
        </section>
      </section>
    </main>
  </div>
  <script src="/admin-mvp.js"></script>
</body>
</html>
