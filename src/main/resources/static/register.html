<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭财务管理系统 - 注册</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
</head>
<body class="ruoyi-auth">
  <main class="auth-layout auth-layout-register" data-page="register">
    <section class="auth-side">
      <div class="brand-row">
        <div class="brand-logo">FM</div>
        <div>
          <div class="brand-title">家庭财务管理系统</div>
          <div class="brand-subtitle">新用户注册入口</div>
        </div>
      </div>

      <div class="intro-panel">
        <div class="section-tag">Register</div>
        <h1>创建项目演示账号</h1>
        <p>注册完成后可直接回到登录页进行认证，再进入管理员后台体验真实数据导入、分析和业务管理能力。</p>
      </div>

      <div class="info-block">
        <div class="info-title">注册说明</div>
        <div class="info-list">
          <div class="info-item">
            <strong>基础字段即可完成</strong>
            <span>用户名、密码、昵称为必填项，其余信息用于补全用户资料。</span>
          </div>
          <div class="info-item">
            <strong>表单单独展示</strong>
            <span>注册页面只承载注册动作，避免和登录入口混排造成信息拥挤。</span>
          </div>
          <div class="info-item">
            <strong>支持示例填充</strong>
            <span>可自动生成一组示例信息，快速完成联调测试。</span>
          </div>
        </div>
      </div>
    </section>

    <section class="auth-main">
      <div class="auth-card">
        <div class="card-head">
          <div>
            <div class="section-tag">Account Register</div>
            <h2>新用户注册</h2>
          </div>
          <a class="text-link" href="/login.html">返回登录</a>
        </div>

        <div id="authStatus" class="status-box">请填写注册信息。</div>

        <form id="registerForm" class="form-block">
          <div class="field-grid">
            <label class="field-block">
              <span>用户名</span>
              <input id="registerUsername" type="text" placeholder="建议使用字母和数字组合">
            </label>
            <label class="field-block">
              <span>密码</span>
              <input id="registerPassword" type="password" placeholder="至少 6 位">
            </label>
            <label class="field-block">
              <span>昵称</span>
              <input id="registerNickname" type="text" placeholder="例如 demo_user">
            </label>
            <label class="field-block">
              <span>真实姓名</span>
              <input id="registerRealName" type="text" placeholder="可选">
            </label>
            <label class="field-block">
              <span>手机号</span>
              <input id="registerPhone" type="text" placeholder="11 位手机号">
            </label>
            <label class="field-block">
              <span>邮箱</span>
              <input id="registerEmail" type="email" placeholder="例如 demo@example.com">
            </label>
          </div>
          <div class="action-row">
            <button id="registerSubmitBtn" class="primary-btn" type="submit">注册账号</button>
            <button id="fillRegisterTemplateBtn" class="ghost-btn" type="button">填充示例信息</button>
          </div>
        </form>

        <div class="switch-panel">
          <span>已有账号？</span>
          <a class="switch-link" href="/login.html">返回登录</a>
        </div>

        <div class="foot-row">
          <button id="enterAdminBtn" class="ghost-btn" type="button">直接进入后台</button>
          <button id="logoutBtn" class="ghost-btn" type="button">清除当前登录</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/auth.js"></script>
</body>
</html>
