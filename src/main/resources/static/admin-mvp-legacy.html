    <style>
        :root {
            --bg-main: #f4f5f7;
            --bg-card: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-color: #e5e7eb;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        /* 婊氬姩鏉℃牱寮?*/
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--surface-400);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--surface-500);
        }
        /* 渚ц竟鏍忔牱寮?*/
        .sidebar {
            background: linear-gradient(180deg, #537aa6 0%, #638cb6 52%, #78a1ca 100%);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-item {
            position: relative;
            transition: all 0.2s ease;
        }
        .sidebar-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: white;
            transform: scaleY(0);
            transition: transform 0.2s ease;
        }
        .sidebar-item:hover,
        .sidebar-item.active {
            background: rgba(255,255,255,0.12);
        }
        .sidebar-item.active::before {
            transform: scaleY(1);
        }
        /* 缁熻鍗＄墖 */
        .stat-card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #60a5fa);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(37, 99, 235, 0.15);
        }
        .stat-card:hover::after {
            opacity: 1;
        }
        /* 鏁版嵁闈㈡澘 */
        .data-panel {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        /* 鍒楄〃椤瑰姩鐢?*/
        .list-item {
            transition: all 0.2s ease;
        }
        .list-item:hover {
            background: var(--surface-100);
        }
        /* 蹇嵎鎸夐挳 */
        .quick-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .quick-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
            transform: translateY(-2px);
        }
        .quick-btn:active {
            transform: translateY(0);
        }
        /* 鍏ュ満鍔ㄧ敾 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; }
        .stagger-4 { animation-delay: 0.2s; }
        .stagger-5 { animation-delay: 0.25s; }
        .stagger-6 { animation-delay: 0.3s; }
        /* 鏁板瓧璁℃暟鍔ㄧ敾 */
        @keyframes countPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .count-animate {
            animation: countPulse 0.3s ease;
        }
        /* 鐘舵€佹寚绀虹伅 */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        /* 鍑忓皯鍔ㄧ敾鍋忓ソ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        /* 鍥炬爣瀹瑰櫒 */
        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        /* 鏍囩鏍峰紡 */

            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .workspace-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .workspace-note {
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
            line-height: 1.65;
        }
        .ops-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }
        .ops-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            padding: 16px;
        }
        .ops-card-label {
            font-size: 12px;
            color: #64748b;

        .ops-table-head,

            color: #0f172a;
        }
        .ops-table-row:last-child {
            border-bottom: none;
        }
        .ops-cell-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ops-cell-title {
            font-weight: 600;
            color: #111827;
        }
        .ops-cell-meta {
            font-size: 12px;
            color: #6b7280;
        }
        .ops-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 26px;
            padding: 0 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #dbeafe;
            background: #eff6ff;
            color: #1d4ed8;
        }
        .ops-badge.success {

            background: #f0fdf4;
            color: #15803d;
        }
        .ops-badge.warning {
            border-color: #fde68a;
            background: #fffbeb;
            color: #b45309;
        }
        .ops-timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .ops-timeline-item {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 14px;
            padding: 14px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
        }

            font-size: 12px;
            font-weight: 600;
            color: #2563eb;
        }
        .ops-timeline-title {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }
        .ops-timeline-meta {
            margin-top: 4px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
        }
        .module-divider {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin: 30px 0 16px;
            padding: 18px 20px;
            border: 1px solid #dbeafe;
            border-radius: 14px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
        }
        .module-divider-copy {

        }
        .module-divider-kicker {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #2563eb;
        }
        .module-divider-title {

            font-weight: 700;
            color: #0f172a;

        .module-divider-desc {

            font-size: 13px;
            line-height: 1.7;
            color: #64748b;
        }
        .module-divider-pill {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 0 12px;
            border-radius: 999px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 600;
        }
        .scroll-section {
            position: relative;
            scroll-margin-top: 88px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .scroll-section.is-current {
            transform: translateY(-2px);
        }
        .scroll-section.is-current .data-panel {
            box-shadow: 0 14px 34px -24px rgba(37, 99, 235, 0.45);
            border-color: #bfdbfe;
        }
        @media (max-width: 1200px) {
            .ops-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 900px) {
            .ops-table-head,
            .ops-table-row {
                grid-template-columns: 1fr;
            }
            .ops-timeline-item {
                grid-template-columns: 1fr;
            }
            .module-divider {
                flex-direction: column;
            }
        }
    </style>
</head>

<script>
    // ====== 鍒濆鍖栧彉閲?======
    let sidebarCollapsed = false;
    // ====== DOM 鍏冪礌鑾峰彇 ======
    const sidebar = document.getElementById('sidebar');
    const refreshIcon = document.getElementById('refreshIcon');
    // ====== 渚ц竟鏍忔姌鍙犲姛鑳?======
    function toggleSidebar() {
        sidebarCollapsed = !sidebarCollapsed;
        if (sidebarCollapsed) {
            sidebar.style.width = '72px';
            // 闅愯棌鏂囧瓧
            sidebar.querySelectorAll('.sidebar-item span, .submenu').forEach(el => {
                el.style.opacity = '0';
                el.style.visibility = 'hidden';
                el.style.width = '0';
                el.style.overflow = 'hidden';
            });
            // 闅愯棌Logo鏂囧瓧
            const logoText = sidebar.querySelector('h1, p');
            if (logoText) {
                logoText.style.display = 'none';
            }
        } else {
            sidebar.style.width = '256px';
            // 鏄剧ず鏂囧瓧
            sidebar.querySelectorAll('.sidebar-item span, .submenu').forEach(el => {
                el.style.opacity = '1';
                el.style.visibility = 'visible';
                el.style.width = 'auto';
                el.style.overflow = 'visible';
            });
            // 鏄剧ずLogo鏂囧瓧
            const logoText = sidebar.querySelector('h1, p');
            if (logoText) {
                logoText.style.display = 'block';
            }
        }
    }
    // ====== 瀛愯彍鍗曞睍寮€/鏀惰捣 ======
    function toggleSubmenu(button) {
        const submenu = button.nextElementSibling;
        const arrow = button.querySelector('.submenu-arrow');
        if (!submenu || !submenu.classList.contains('submenu')) return;
        const isHidden = submenu.classList.contains('hidden');
        // 鍏抽棴鍏朵粬鎵撳紑鐨勫瓙鑿滃崟
        document.querySelectorAll('.submenu:not(.hidden)').forEach(menu => {
            if (menu !== submenu) {
                menu.classList.add('hidden');
                const parentArrow = menu.previousElementSibling?.querySelector('.submenu-arrow');
                if (parentArrow) {
                    parentArrow.style.transform = 'rotate(0deg)';
                }
            }
        });
        // 鍒囨崲褰撳墠瀛愯彍鍗?
        if (isHidden) {
            submenu.classList.remove('hidden');
            arrow.style.transform = 'rotate(180deg)';
        } else {
            submenu.classList.add('hidden');
            arrow.style.transform = 'rotate(0deg)';
        }
    }
    // ====== 鏁板瓧婊氬姩鍔ㄧ敾 ======
    function animateCount(element, target, duration) {
        if (!element) return;
        const start = 0;
        const startTime = performance.now();
        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            // 缂撳姩鍑芥暟
            const easeOutQuart = 1 - Math.pow(1 - progress, 4);
            const current = Math.floor(start + (target - start) * easeOutQuart);
            element.textContent = current.toLocaleString();
            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                element.textContent = target.toLocaleString();
            }
        }
        requestAnimationFrame(update);
    }
    // ====== 鍒濆鍖栨暟瀛楀姩鐢?======
    function initCountAnimations() {
        const counters = document.querySelectorAll('.count-number');
        // 浣跨敤 IntersectionObserver 鐩戝惉鍏冪礌杩涘叆瑙嗗彛
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const target = parseInt(entry.target.dataset.target, 10);
                    animateCount(entry.target, target, 1500);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.5 });
        counters.forEach(counter => observer.observe(counter));
    }
    // ====== 鍒锋柊鏁版嵁鍔ㄧ敾 ======
    function refreshData() {
        refreshIcon.style.animation = 'spin 0.8s linear infinite';
        // 閲嶇疆鏁板瓧骞堕噸鏂板姩鐢?
        setTimeout(() => {
            const counters = document.querySelectorAll('.count-number');
            counters.forEach(counter => {
                counter.textContent = '0';
                const target = parseInt(counter.dataset.target, 10);
                animateCount(counter, target, 1200);
            });
            setTimeout(() => {
                refreshIcon.style.animation = '';
            }, 800);
        }, 300);
    }
    // 娣诲姞鏃嬭浆鍔ㄧ敾
    const styleSheet = document.createElement('style');
    styleSheet.textContent = `
	      @keyframes spin {
	        from { transform: rotate(0deg); }
	        to { transform: rotate(360deg); }
	      }
	    `;
    document.head.appendChild(styleSheet);
    // ====== 鍒濆鍖?======
    document.addEventListener('DOMContentLoaded', () => {
        initCountAnimations();
        // 榛樿灞曞紑绗竴涓瓙鑿滃崟锛堟紨绀虹敤锛?
        // 鍙互鏍规嵁闇€瑕佸彇娑堟敞閲?
        // const firstSubmenuBtn = document.querySelector('.sidebar-item button');
        // if (firstSubmenuBtn) toggleSubmenu(firstSubmenuBtn);
    });
    // ====== 閿洏鍙闂€у寮?======
    document.addEventListener('keydown', (e) => {
        // ESC 鍏抽棴鎵€鏈夊瓙鑿滃崟
        if (e.key === 'Escape') {
            document.querySelectorAll('.submenu:not(.hidden)').forEach(menu => {
                menu.classList.add('hidden');
                const arrow = menu.previousElementSibling?.querySelector('.submenu-arrow');
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            });
        }
    });
</script>
